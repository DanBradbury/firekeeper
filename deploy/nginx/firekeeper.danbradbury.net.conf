# nginx vhost for Firekeeper. Installed by deploy/setup-nginx.sh to
# /etc/nginx/sites-available/. HTTP only; `certbot --nginx` adds HTTPS and the
# redirect. Proxies to the container on loopback port 7777.
server {
    listen 80;
    listen [::]:80;
    server_name firekeeper.danbradbury.net;

    # Ingest requests are at most 5 MiB.
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # Server-sent events: no buffering, no compression, long reads.
    location = /v1/stream {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
