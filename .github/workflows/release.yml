# Pushing a v* tag publishes a GitHub release with binaries and checksums.
# Tags with a suffix, such as v0.1.0-rc1, publish as prereleases and do not
# update the Homebrew tap. The Homebrew tap repository and its token
# (HOMEBREW_TAP_GITHUB_TOKEN) are owner setup.
#
# This publishes only the `firekeeper` client. `firekeeper-server` is released
# from the private firekeeper-server repository to
# DanBradbury/firekeeper-server-releases. The firekeeper formula depends on the
# firekeeper-server formula in the same tap, so that formula must exist in the
# tap before a firekeeper release is pushed to it, or `brew install` of the new
# formula fails to resolve its dependency.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the tag that triggered this run. Without it GoReleaser
          # picks the closest tag, which is wrong when two tags (such as
          # v0.1.0-rc1 and v0.1.0) point at the same commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
