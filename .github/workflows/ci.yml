name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Includes the install.sh tests, which run against a fake local
      # release directory with no network.
      - name: go test
        run: go test ./...

      - name: shellcheck
        run: shellcheck -s sh install.sh

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Catches a broken release config before anyone tags.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Snapshot binary reports its version
        run: |
          out="$(./dist/firekeeper_linux_amd64_v1/firekeeper --version)"
          echo "$out"
          case "$out" in
            "firekeeper dev "*) echo "version was not stamped"; exit 1 ;;
          esac
