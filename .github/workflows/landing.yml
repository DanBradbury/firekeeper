# Deploys the static landing page in docs/landing to Cloudflare Pages, served
# at usefirekeeper.com. Runs on a push to main that changes the page, or by
# hand ("Run workflow").
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the
# Account > Cloudflare Pages > Edit permission) and CLOUDFLARE_ACCOUNT_ID.
# The first run creates the Pages project; the custom domain is attached once
# in the Cloudflare dashboard (Workers & Pages > usefirekeeper > Custom
# domains).
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: usefirekeeper
  WRANGLER_VERSION: 4.148.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Create the project on the first run. On later runs it already exists
      # and this step's error is ignored; a real auth problem still fails the
      # deploy step below.
      - name: Create Pages project if missing
        run: npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch=main || true
      - name: Deploy
        run: >-
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy docs/landing
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
