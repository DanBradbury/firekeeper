# Deploys the static landing page in docs/landing to Cloudflare Pages, served
# at usefirekeeper.com. Runs on a push to main that changes the page, or by
# hand ("Run workflow").
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the
# Account > Cloudflare Pages > Edit permission) and CLOUDFLARE_ACCOUNT_ID.
# The first run creates the Pages project; the custom domain is attached once
# in the Cloudflare dashboard (Workers & Pages > usefirekeeper > Custom
# domains).
name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "docs/landing/**"
      # The page runs the dashboard itself (cmd/demo-wasm), so a change to it
      # changes the page.
      - "cmd/demo-wasm/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: usefirekeeper
  WRANGLER_VERSION: 4.148.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The browser demo is not committed: build it, prove it runs, and ship
      # it with the page. A failure here stops the deploy and leaves the
      # live page as it was.
      - name: Build the browser demo
        run: cmd/demo-wasm/build.sh
      - name: Run the browser demo in Node
        run: node scripts/test-demo-wasm.cjs
      # Create the project on the first run. On later runs it already exists
      # and this step's error is ignored; a real auth problem still fails the
      # deploy step below.
      - name: Create Pages project if missing
        run: npx --yes "wrangler@$WRANGLER_VERSION" pages project create "$PAGES_PROJECT" --production-branch=main || true
      - name: Deploy
        run: >-
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy docs/landing
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
