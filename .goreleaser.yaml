# Release config for the `firekeeper` client only. Firekeeper ships as two
# binaries: this repository builds `firekeeper`; the commercial `firekeeper-server`
# is built and released from the private firekeeper-server repository to the
# public DanBradbury/firekeeper-server-releases repository. Nothing here builds
# or archives the server. CI runs `goreleaser release --snapshot --clean` on pull
# requests; .github/workflows/release.yml runs the real release on v* tags.
version: 2

project_name: firekeeper

before:
  hooks:
    - go mod download

builds:
  - id: firekeeper
    main: .
    binary: firekeeper
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # The linker ignores -X for a variable that does not exist, so a wrong
      # path fails silently; CI's snapshot job checks the built version.
      - -X github.com/DanBradbury/firekeeper/internal/version.Version={{ .Version }}
      - -X github.com/DanBradbury/firekeeper/internal/version.Commit={{ .Commit }}
      - -X github.com/DanBradbury/firekeeper/internal/version.Date={{ .Date }}
      # Switches on the `firekeeper serve` offer to download firekeeper-server
      # from the public, binaries-only releases repository. It is asked only on
      # a terminal, after an explicit yes (see AGENTS.md). Keep this equal to
      # serverinstall.ProductionBase, which the code recognises by value.
      - -X github.com/DanBradbury/firekeeper/internal/serverinstall.ReleasesURL=https://github.com/DanBradbury/firekeeper-server-releases

archives:
  - id: firekeeper
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  # v0.1.0-rc1 and similar publish as prereleases.
  prerelease: auto

# A formula, not a cask, so macOS does not quarantine the binary. The tap
# repo and token are owner setup.
brews:
  - name: firekeeper
    repository:
      owner: DanBradbury
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/DanBradbury/firekeeper
    description: Keyboard-driven terminal dashboard for monitoring coding-agent harnesses (installs firekeeper-server too)
    license: Apache-2.0
    # Prereleases do not move the tap.
    skip_upload: auto
    # `brew install DanBradbury/tap/firekeeper` installs both binaries. The
    # firekeeper-server formula lives in the same tap and is published from the
    # server's release pipeline. The client never needs it to run: plain
    # `firekeeper` does not call the server, and `serve` finds the brew-installed
    # one on PATH.
    dependencies:
      - name: firekeeper-server
    test: |
      assert_match version.to_s, shell_output("#{bin}/firekeeper --version")
