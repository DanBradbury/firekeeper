<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks – Firekeeper</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://firekeeper.ai/thanks">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#14110f">
<style>
:root {
  --bg: #fbf8f4;
  --surface: #ffffff;
  --surface-2: #f3eee7;
  --text: #1d1a17;
  --muted: #6b625a;
  --border: #e4dcd2;
  --ember: #c2410c;
  --ember-soft: #fde7d9;
  --ember-text: #9a3412;
  --code-bg: #1b1815;
  --code-text: #f3ece4;
  --code-muted: #a39a90;
  --ok: #15803d;
  --warn: #b45309;
  --info: #2563eb;
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110f;
    --surface: #1c1916;
    --surface-2: #24201c;
    --text: #f1ebe4;
    --muted: #a79d93;
    --border: #332d27;
    --ember: #f97316;
    --ember-soft: #3a2116;
    --ember-text: #fdba74;
    --code-bg: #0e0c0a;
    --ok: #4ade80;
    --warn: #fbbf24;
    --info: #60a5fa;
  }
}
:root[data-theme="dark"] {
  --bg: #14110f;
  --surface: #1c1916;
  --surface-2: #24201c;
  --text: #f1ebe4;
  --muted: #a79d93;
  --border: #332d27;
  --ember: #f97316;
  --ember-soft: #3a2116;
  --ember-text: #fdba74;
  --code-bg: #0e0c0a;
  --ok: #4ade80;
  --warn: #fbbf24;
  --info: #60a5fa;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--ember-text); }
code { font-family: var(--mono); font-size: 0.9em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

/* Nav */
nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
nav .wrap { display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); text-decoration: none; }
.brand svg { width: 22px; height: 22px; }
nav ul { list-style: none; display: flex; gap: 20px; margin: 0 0 0 auto; padding: 0; }
nav ul a { display: inline-block; padding: 14px 2px; color: var(--muted); text-decoration: none; font-size: 14px; }
.menu { display: none; margin-left: auto; font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: none; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
nav ul a:hover { color: var(--text); }
@media (max-width: 720px) {
  nav .wrap { flex-wrap: wrap; height: auto; min-height: 56px; gap: 0 16px; }
  .menu { display: inline-block; }
  nav ul { margin-left: 0; gap: 14px; }
  nav ul li.opt { display: none; }
  nav.open ul { flex-basis: 100%; order: 3; flex-direction: column; gap: 0; padding-bottom: 8px; }
  nav.open ul li.opt { display: list-item; }
  nav.open ul a { display: block; padding: 12px 2px; }
}

/* Hero */
.hero { padding: 72px 0 48px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 40px; align-items: center; }
.hero-grid > *, .mode, .card, ol.steps li > div { min-width: 0; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 32px; } .hero { padding-top: 48px; } }
.eyebrow { display: inline-block; font-size: 13px; font-weight: 600; color: var(--ember-text); background: var(--ember-soft); padding: 4px 10px; border-radius: 999px; margin-bottom: 16px; }
h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 16px; }
h1 em { font-style: normal; color: var(--ember); }
.lede { font-size: 18px; color: var(--muted); margin: 0 0 28px; max-width: 34em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid transparent; }
.btn-primary { background: var(--ember); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border-color: var(--border); color: var(--text); background: var(--surface); }
.btn-ghost:hover { border-color: var(--muted); }

/* Screenshot */
.shot-link { display: block; cursor: zoom-in; }
dialog.lightbox { border: 0; padding: 0; margin: 0; max-width: none; max-height: none; width: 100vw; height: 100vh; background: rgba(10,8,6,.92); cursor: zoom-out; }
dialog.lightbox::backdrop { background: transparent; }
dialog.lightbox img { position: absolute; inset: 0; margin: auto; max-width: 96vw; max-height: 94vh; width: auto; height: auto; border-radius: var(--radius); }
dialog.lightbox button { position: absolute; top: 12px; right: 16px; font: inherit; font-size: 28px; line-height: 1; color: #fff; background: none; border: 0; cursor: pointer; padding: 4px 10px; }
@media (max-width: 900px) { .shot-link { max-width: 654px; margin: 0 auto; } }
.shot { display: block; width: 100%; height: auto; border-radius: var(--radius); border: 1px solid #2c2722; box-shadow: 0 20px 50px -20px rgba(0,0,0,.45); background: var(--code-bg); }

/* Sections */
section { padding: 64px 0; border-top: 1px solid var(--border); }
.section-head { max-width: 640px; margin-bottom: 32px; }
h2 { font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.015em; line-height: 1.15; margin: 0 0 10px; }
.section-head p { color: var(--muted); margin: 0; font-size: 17px; }
h3 { font-size: 17px; margin: 0 0 6px; }

/* Features */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
.card p { margin: 0; color: var(--muted); font-size: 15px; }
.card .icon { width: 36px; height: 36px; border-radius: 8px; background: var(--ember-soft); color: var(--ember-text); display: grid; place-items: center; margin-bottom: 14px; }
.card .icon svg { width: 20px; height: 20px; }
.card ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }

/* Install */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 0; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; background: none; border: none; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--ember); }
.panel { display: none; padding-top: 18px; }
.panel.active { display: block; }
.panel > p { color: var(--muted); font-size: 15px; margin: 14px 0 0; }
.code { position: relative; background: var(--code-bg); color: var(--code-text); border-radius: 8px; font: 13.5px/1.6 var(--mono); }
.code pre { margin: 0; padding: 16px 56px 16px 16px; overflow-x: auto; }
.code .c { color: var(--code-muted); }
.copy { position: absolute; top: 8px; right: 8px; font: 600 12px var(--sans); color: var(--code-text); background: #2c2722; border: 1px solid #3d362f; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.copy:hover { background: #3a322b; }
@media (max-width: 520px) { .code pre { padding: 44px 16px 16px; } }
@media (pointer: coarse) { .copy { min-height: 44px; min-width: 44px; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.install-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 24px; }
.install-meta div { font-size: 14px; color: var(--muted); padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.install-meta strong { display: block; color: var(--text); font-size: 14px; }

/* Modes */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.mode { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.mode .step { font: 600 12px var(--mono); color: var(--ember-text); text-transform: uppercase; letter-spacing: .06em; }
.mode p { margin: 0; font-size: 15px; color: var(--muted); }
.mode .leaves { margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 14px; }
.mode .leaves b { color: var(--text); }
.tier { display: flex; flex-direction: column; gap: 6px; }
.price { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.price small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.tier ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.tier .btn { margin-top: auto; align-self: flex-start; }
.tier .spacer { flex: 1; }

/* Table */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: none; }
td:first-child { font-weight: 600; white-space: nowrap; }
.yes { color: var(--ok); font-weight: 600; }
.part { color: var(--warn); font-weight: 600; }
.no { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); margin-top: 14px; }

/* Steps */
ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 18px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 36px 1fr; gap: 14px; }
ol.steps li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--ember-soft); color: var(--ember-text); font-weight: 700; display: grid; place-items: center; }
ol.steps h3 { margin-top: 4px; }
ol.steps p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }

/* Privacy */
.privacy { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.privacy div { padding: 18px; border-left: 3px solid var(--ember); background: var(--surface); border-radius: 0 8px 8px 0; }
.privacy p { margin: 0; font-size: 14px; color: var(--muted); }
.callout { margin-top: 20px; padding: 14px 16px; border-radius: 8px; background: var(--ember-soft); color: var(--text); font-size: 14px; }

/* CLI */
.cli-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.cli { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.cli code { background: none; padding: 0; font-weight: 600; color: var(--text); }
.cli span { font-size: 14px; color: var(--muted); }

/* Keys */
.keys { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; font-size: 14px; color: var(--muted); }
kbd { font: 600 12px var(--mono); background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px; color: var(--text); }

footer { border-top: 1px solid var(--border); padding: 36px 0 48px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; }
footer ul { list-style: none; display: flex; flex-wrap: wrap; gap: 0 18px; margin: 0; padding: 0; }
footer a { color: var(--muted); display: inline-block; padding: 12px 0; }

/* Contact form */
.form-wrap { max-width: 640px; }
form.contact { display: grid; gap: 18px; margin-top: 8px; }
.field { display: grid; gap: 6px; }
.field label, fieldset legend { font-size: 14px; font-weight: 600; }
.field .hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.field input[type=text], .field input[type=email], .field select, .field textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; min-height: 44px; width: 100%; }
.field textarea { min-height: 120px; resize: vertical; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px 8px; margin: 0; }
fieldset label { display: inline-flex; align-items: center; gap: 8px; margin: 0 16px 8px 0; min-height: 28px; font-size: 15px; font-weight: 400; }
.hp { position: absolute; left: -9999px; }
button.btn { font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; justify-self: start; }
.form-status { font-size: 15px; }
.form-status.ok { color: var(--ok); }
.form-status.err { color: var(--warn); }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2c1.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.1 2.6 2.3 3C11 7.4 11.2 4.6 12 2Z" fill="#f97316"/><path d="M12 13c.8 1.2 2 2 2 3.6a2 2 0 0 1-4 0c0-1.2.9-2 2-3.6Z" fill="#fde68a"/><path d="M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Firekeeper
    </a>
    <ul>
      <li><a href="/#pricing">Pricing</a></li>
      <li><a href="https://github.com/DanBradbury/firekeeper">GitHub</a></li>
    </ul>
  </div>
</nav>

<main>
<section style="border-top:0">
  <div class="wrap form-wrap">
    <div class="section-head">
      <h2>Thanks, we got your message</h2>
      <p>We will email you shortly to find a time to talk.</p>
    </div>
    <div class="cta">
      <a class="btn btn-primary" href="/">Back to Firekeeper</a>
      <a class="btn btn-ghost" href="/#install">Install the client</a>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div>© 2026 Dan Bradbury</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="https://github.com/DanBradbury/firekeeper/blob/main/PRIVACY.md">Privacy</a></li>
    </ul>
  </div>
</footer>

</body>
</html>
