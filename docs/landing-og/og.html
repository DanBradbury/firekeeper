<!doctype html>
<!--
  Source for docs/landing/og.png (1200x630), the link preview image, and
  docs/landing/apple-touch-icon.png (180x180). Render with
  docs/landing-og/render.js after changing this file or the screenshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .og {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(700px 500px at 18% 105%, rgba(249,115,22,.38), transparent 70%),
      radial-gradient(500px 360px at 8% 0%, rgba(253,186,116,.12), transparent 70%),
      #14110f;
    color: #f1ebe4;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 30px; }
  .brand svg { width: 60px; height: 60px; }
  h1 { font-size: 60px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 800; }
  h1 em { font-style: normal; color: #f97316; }
  p { margin-top: 26px; font-size: 25px; line-height: 1.4; color: #b3a89d; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 8px; width: 500px; }
  .chips span { font-size: 17px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #2a231e; color: #fdba74; border: 1px solid #3d322a; }
  /* The screenshot has a black margin around the window; the frame crops it. */
  .shot {
    position: absolute; left: 640px; top: 72px; width: 900px; height: 488px; overflow: hidden;
    border-radius: 14px; border: 1px solid #3a322b; background: #16161c;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 8px rgba(249,115,22,.06);
  }
  .shot img { position: absolute; width: 984px; left: -42px; top: -28px; }

  .icon {
    width: 180px; height: 180px; display: grid; place-items: center;
    background: radial-gradient(120px 100px at 50% 100%, rgba(249,115,22,.45), transparent 75%), #14110f;
  }
  .icon svg { width: 120px; height: 120px; }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c1.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.1 2.6 2.3 3C11 7.4 11.2 4.6 12 2Z" fill="#f97316"/><path d="M12 13c.8 1.2 2 2 2 3.6a2 2 0 0 1-4 0c0-1.2.9-2 2-3.6Z" fill="#fde68a"/><path d="M5 21h14" stroke="#f1ebe4" stroke-width="2" stroke-linecap="round"/></svg>
      Firekeeper
    </div>
    <h1>Tend every coding agent from <em>one bonfire</em>.</h1>
    <p>See what your AI coding agents are doing, right from your terminal.</p>
    <div class="chips"><span>Claude Code</span><span>Codex</span><span>Copilot CLI</span><span>Gemini CLI</span><span>Cursor</span><span>OpenCode</span><span>Kimi</span></div>
  </div>
  <div class="shot"><img src="../firekeeper-tui.jpg" alt=""></div>
</div>

<div class="icon" id="icon">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c1.5 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.3 1.6 1.1 2.6 2.3 3C11 7.4 11.2 4.6 12 2Z" fill="#f97316"/><path d="M12 13c.8 1.2 2 2 2 3.6a2 2 0 0 1-4 0c0-1.2.9-2 2-3.6Z" fill="#fde68a"/><path d="M5 21h14" stroke="#f1ebe4" stroke-width="2" stroke-linecap="round"/></svg>
</div>
</body>
</html>
