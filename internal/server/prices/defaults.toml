# Default model prices for the dashboard's estimated cost.
#
# Rates are USD per million tokens, copied from each provider's public
# pricing page on the entry's as_of date. Every rate is the standard,
# short-context list price: no batch discount, no long-context tier, no
# cache-write price. See docs/prices.md for how to refresh this file.
#
# A model is matched by its exact name, then by an entry's aliases. Add an
# alias only when a harness is known to report that exact name.

as_of = "2026-10-14"

# Anthropic. Source: the model pricing table, "Cache hits and refreshes"
# is the cache rate. Claude Haiku 5.5 is left out because its price depends
# on prompt length (over 100,000 tokens costs five times more), which this
# table cannot express. Claude Fable 5 is left out because its API model ID
# is not listed on a public Anthropic page.

[[model]]
name = "claude-fable-5-1"
input = 10
output = 50
cache = 0.25
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-10-14"

[[model]]
name = "claude-opus-5-5"
input = 4
output = 20
cache = 0.20
source = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-10-14"

